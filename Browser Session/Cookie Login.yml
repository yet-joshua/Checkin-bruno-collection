info:
  name: Cookie Login
  type: http
  seq: 3

http:
  method: POST
  url: "{{baseUrl}}/admin/login"
  headers:
    - name: Accept
      value: application/json
    - name: Origin
      value: "{{frontendOrigin}}"
    - name: Cookie
      value: "{{browser_cookie}}"
    - name: X-XSRF-TOKEN
      value: "{{xsrf_token}}"
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "email": "{{browser_admin_email}}",
        "password": "{{browser_admin_password}}",
        "remember": true
      }
  auth: null

runtime:
  scripts:
    - type: after-response
      code: |-
        const raw = res.getHeader("set-cookie") || [];
        const jar = JSON.parse(bru.getEnvVar("browser_cookies") || "{}");
        for (const line of (Array.isArray(raw) ? raw : [raw])) {
          const pair = line.split(";")[0]; const index = pair.indexOf("=");
          jar[pair.slice(0, index)] = pair.slice(index + 1);
        }
        bru.setEnvVar("browser_cookies", JSON.stringify(jar));
        bru.setEnvVar("browser_cookie", Object.entries(jar).map(([k, v]) => k + "=" + v).join("; "));
        if (jar["XSRF-TOKEN"]) bru.setEnvVar("xsrf_token", decodeURIComponent(jar["XSRF-TOKEN"]));
    - type: tests
      code: |-
        test("Expected authentication status", function () {
          expect(res.getStatus()).to.equal(200);
        });
        test("Remember cookie is issued", function () {
          const cookies = res.getHeader("set-cookie") || [];
          expect((Array.isArray(cookies) ? cookies : [cookies]).some(cookie => cookie.startsWith("remember_web_"))).to.equal(true);
        });
        test("No browser bearer token", function () { expect(res.getBody().data).not.to.have.property("token"); });

settings:
  encodeUrl: true
  timeout: 10000
  followRedirects: true
  maxRedirects: 5
