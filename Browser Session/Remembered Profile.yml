info:
  name: Remembered Profile
  type: http
  seq: 4

http:
  method: GET
  url: "{{baseUrl}}/admin/me"
  headers:
    - name: Accept
      value: application/json
    - name: Origin
      value: "{{frontendOrigin}}"
    - name: Cookie
      value: "{{browser_cookie}}"
  auth: null

runtime:
  scripts:
    - type: before-request
      code: |-
        const jar = JSON.parse(bru.getEnvVar("browser_cookies") || "{}");
        const remembered = Object.entries(jar).filter(([name]) => name.startsWith("remember_web_") || name === "XSRF-TOKEN");
        bru.setEnvVar("browser_cookies", JSON.stringify(Object.fromEntries(remembered)));
        req.setHeader("Cookie", remembered.map(([k, v]) => k + "=" + v).join("; "));
    - type: after-response
      code: |-
        const raw = res.getHeader("set-cookie") || [];
        const jar = JSON.parse(bru.getEnvVar("browser_cookies") || "{}");
        for (const line of (Array.isArray(raw) ? raw : [raw])) {
          const pair = line.split(";")[0]; const index = pair.indexOf("=");
          jar[pair.slice(0, index)] = pair.slice(index + 1);
        }
        bru.setEnvVar("browser_cookies", JSON.stringify(jar));
        bru.setEnvVar("browser_cookie", Object.entries(jar).map(([k, v]) => k + "=" + v).join("; "));
        if (jar["XSRF-TOKEN"]) bru.setEnvVar("xsrf_token", decodeURIComponent(jar["XSRF-TOKEN"]));
    - type: tests
      code: |-
        test("Remember cookie restores profile without original session", function () {
          expect(res.getStatus()).to.equal(200);
          expect(res.getBody().data.email).to.equal(bru.getEnvVar("browser_admin_email"));
        });

settings:
  encodeUrl: true
  timeout: 10000
  followRedirects: true
  maxRedirects: 5
