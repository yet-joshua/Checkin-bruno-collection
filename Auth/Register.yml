info:
  name: Register
  type: http
  seq: 2

http:
  method: POST
  url: "{{baseUrl}}/auth/register"
  headers:
    - name: Accept
      value: application/json
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |
      {
        "firebase_token": "{{firebase_token}}",
        "auth_version": 2,
        "contact_number": "+639123456789",
        "password": "Password123!",
        "password_confirmation": "Password123!"
      }
  auth: null

runtime:
  scripts:
    - type: tests
      code: |-
        test("Registration returns a mobile token pair", function () {
          expect(res.getStatus()).to.equal(201);
          expect(res.getBody().data.refresh_token).to.be.a("string").with.lengthOf(64);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
