info:
  name: Change Password
  type: http
  seq: 6

http:
  method: POST
  url: "{{baseUrl}}/auth/change-password"
  headers:
    - name: Accept
      value: application/json
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |
      {
        "current_password": "password",
        "password": "NewSecretPassword123!",
        "password_confirmation": "NewSecretPassword123!"
      }
  auth:
    type: bearer
    token: "{{auth_token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
