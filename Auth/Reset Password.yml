info:
  name: Reset Password
  type: http
  seq: 5

http:
  method: POST
  url: "{{baseUrl}}/auth/reset-password"
  headers:
    - name: Accept
      value: application/json
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |
      {
        "firebase_token": "BYPASS_TOKEN",
        "contact_number": "+639123456789",
        "password": "NewSecretPassword123!",
        "password_confirmation": "NewSecretPassword123!"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
