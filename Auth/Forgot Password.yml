info:
  name: Forgot Password
  type: http
  seq: 4

http:
  method: POST
  url: "{{baseUrl}}/auth/forgot-password"
  headers:
    - name: Accept
      value: application/json
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |
      {
        "contact_number": "+639123456789"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
