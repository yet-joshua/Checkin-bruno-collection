info:
  name: Event Missions
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/events/{event_id}/missions"
  headers:
    - name: Accept
      value: application/json
    - name: Content-Type
      value: application/json
  auth:
    type: bearer
    token: "{{auth_token}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("Event missions return mission list and completion percentage", function () {
          if (res.getStatus() !== 200) throw new Error("Expected HTTP 200");
          const body = res.getBody();
          if (!Array.isArray(body.missions) || !Number.isFinite(body.completion_percentage)) {
            throw new Error("Expected missions array and numeric completion_percentage");
          }
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
