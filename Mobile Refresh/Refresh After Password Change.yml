info:
  name: Refresh After Password Change
  type: http
  seq: 13

http:
  method: POST
  url: "{{baseUrl}}/auth/refresh"
  headers:
    - name: Accept
      value: application/json
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "refresh_token": "{{mobile_refresh}}"
      }
  auth: null

runtime:
  scripts:
    - type: after-response
      code: |-
        const data = res.getBody().data;
        if (res.getStatus() === 200) {
          bru.setEnvVar("mobile_access", data.token);
          bru.setEnvVar("mobile_refresh", data.refresh_token);
          bru.setEnvVar("mobile_session", data.session_id);
          bru.setEnvVar("mobile_expiry", data.refresh_token_expires_at);
        }
    - type: tests
      code: |-
        test("Refresh After Password Change", function () {
          expect(res.getStatus()).to.equal(200);

        });

settings:
  encodeUrl: true
  timeout: 10000
  followRedirects: false
