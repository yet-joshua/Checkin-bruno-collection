info:
  name: Change Password Rotates Pair
  type: http
  seq: 10

http:
  method: POST
  url: "{{baseUrl}}/auth/change-password"
  headers:
    - name: Accept
      value: application/json
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "current_password": "{{mobile_password}}",
        "password": "{{mobile_new_password}}",
        "password_confirmation": "{{mobile_new_password}}"
      }
  auth:
    type: bearer
    token: "{{mobile_access}}"

runtime:
  scripts:
    - type: before-request
      code: |-
        bru.setEnvVar("mobile_old_refresh", bru.getEnvVar("mobile_refresh"));
    - type: after-response
      code: |-
        const data = res.getBody().data;
        if (res.getStatus() === 200) {
          bru.setEnvVar("mobile_access", data.token);
          bru.setEnvVar("mobile_refresh", data.refresh_token);
          bru.setEnvVar("mobile_session", data.session_id);
          bru.setEnvVar("mobile_expiry", data.refresh_token_expires_at);
        }
    - type: tests
      code: |-
        test("Change Password Rotates Pair", function () {
          expect(res.getStatus()).to.equal(200);
          expect(res.getBody().data.refresh_token).to.be.a("string").with.lengthOf(64);
          expect(Date.parse(res.getBody().data.token_expires_at)).to.be.above(Date.now());
          expect(Date.parse(res.getBody().data.token_expires_at)).to.be.at.most(Date.now() + 16 * 60 * 1000);
        });

settings:
  encodeUrl: true
  timeout: 10000
  followRedirects: false
