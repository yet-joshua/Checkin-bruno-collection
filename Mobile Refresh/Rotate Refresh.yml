info:
  name: Rotate Refresh
  type: http
  seq: 3

http:
  method: POST
  url: "{{baseUrl}}/auth/refresh"
  headers:
    - name: Accept
      value: application/json
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "refresh_token": "{{mobile_refresh}}"
      }
  auth: null

runtime:
  scripts:
    - type: before-request
      code: |-
        bru.setEnvVar("mobile_old_access", bru.getEnvVar("mobile_access"));
        bru.setEnvVar("mobile_old_refresh", bru.getEnvVar("mobile_refresh"));
        bru.setEnvVar("mobile_old_session", bru.getEnvVar("mobile_session"));
        bru.setEnvVar("mobile_old_expiry", bru.getEnvVar("mobile_expiry"));
    - type: after-response
      code: |-
        const data = res.getBody().data;
        if (res.getStatus() === 200) {
          bru.setEnvVar("mobile_access", data.token);
          bru.setEnvVar("mobile_refresh", data.refresh_token);
          bru.setEnvVar("mobile_session", data.session_id);
          bru.setEnvVar("mobile_expiry", data.refresh_token_expires_at);
        }
    - type: tests
      code: |-
        test("Rotate Refresh", function () {
          expect(res.getStatus()).to.equal(200);
          expect(res.getBody().data.refresh_token).to.be.a("string").with.lengthOf(64);
          expect(Date.parse(res.getBody().data.token_expires_at)).to.be.above(Date.now());
          expect(Date.parse(res.getBody().data.token_expires_at)).to.be.at.most(Date.now() + 16 * 60 * 1000);
          expect(res.getBody().data.session_id).to.equal(bru.getEnvVar("mobile_old_session"));
          expect(res.getBody().data.refresh_token_expires_at).to.equal(bru.getEnvVar("mobile_old_expiry"));
        });

settings:
  encodeUrl: true
  timeout: 10000
  followRedirects: false
