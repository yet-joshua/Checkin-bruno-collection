info:
  name: All Favorite Events
  type: http
  seq: 2

http:
  method: GET
  url: "{{baseUrl}}/user/favorites/events"
  headers:
    - name: Accept
      value: application/json
    - name: Content-Type
      value: application/json
  auth:
    type: bearer
    token: "{{auth_token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
