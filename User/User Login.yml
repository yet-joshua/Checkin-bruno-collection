info:
  name: User Login
  type: http
  seq: 10

http:
  method: POST
  url: "{{baseUrl}}/auth/login"
  body:
    type: json
    data: |
      {
        "contact_number": "+639171000002",
        "password": "password"
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        if (res.getStatus() === 200) {
          bru.setEnvVar("auth_token", res.getBody().data.token);
        }
    - type: tests
      code: |-
        test("Login returns an expiring token", function () {
          expect(res.getStatus()).to.equal(200);
          expect(Date.parse(res.getBody().data.token_expires_at)).to.be.above(Date.now());
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
