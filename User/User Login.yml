info:
  name: User Login
  type: http
  seq: 2

http:
  method: POST
  url: "{{checkin}}/api/v1/login"
  body:
    type: json
    data: |
      {
          "contact_number": "required|string",
          "password": "required|string"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
