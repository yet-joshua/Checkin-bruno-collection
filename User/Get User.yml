info:
  name: Get User
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/user"
  headers:
    - name: Accept
      value: application/json
    - name: Content-Type
      value: application/json
  auth:
    type: bearer
    token: "{{auth_token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
