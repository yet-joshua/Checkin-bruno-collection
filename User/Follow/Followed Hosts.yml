info:
  name: Followed Hosts
  type: http
  seq: 3

http:
  method: GET
  url: "{{baseUrl}}/user/follows"
  headers:
    - name: Accept
      value: application/json
  auth:
    type: bearer
    token: "{{auth_token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
