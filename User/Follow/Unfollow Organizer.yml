info:
  name: Unfollow Organizer
  type: http
  seq: 1

http:
  method: POST
  url: "{{checkin}}/api/v1/hosts/{admin}/unfollow"
  headers:
    - name: Accept
      value: application/json
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: ""
  auth:
    type: bearer
    token: "{{auth_token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
