info:
  name: Comment Organizer
  type: http
  seq: 3

http:
  method: POST
  url: "{{checkin}}/api/v1/hosts/019d8f71-08e6-71a8-955e-068b58ef53b2/reviewss"
  headers:
    - name: Accept
      value: application/json
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |
      {
        "rating": 5, //optional
        "comment": "Great host!" //optional
      }
  auth:
    type: bearer
    token: "{{auth_token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
