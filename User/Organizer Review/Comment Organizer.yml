info:
  name: Comment Organizer
  type: http
  seq: 1

http:
  method: POST
  url: "{{baseUrl}}/hosts/{admin_id}/reviews"
  headers:
    - name: Accept
      value: application/json
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |
      {
        "rating": 5,
        "comment": "Great host!"
      }
  auth:
    type: bearer
    token: "{{auth_token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5