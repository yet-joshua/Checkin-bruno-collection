info:
  name: Unregister Current Device
  type: http
  seq: 3

http:
  method: DELETE
  url: "{{baseUrl}}/user/devices/current"
  body:
    type: json
    data: |-
      { "device_id": "mobile-test-device" }
  auth:
    type: bearer
    token: "{{auth_token}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("Mobile account request succeeds", function () {
          if (res.getStatus() !== 200) throw new Error("Unexpected response status");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5