info:
  name: Register FCM
  type: http
  seq: 1

http:
  method: POST
  url: "{{baseUrl}}/user/devices"
  headers:
    - name: Accept
      value: application/json
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "fcm_token": "firebase-registration-token",
        "platform": "android",
        "device_id": "optional-client-device-id"
      }
  auth:
    type: bearer
    token: "{{auth_token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5