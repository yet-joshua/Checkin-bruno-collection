info:
  name: Register Bypass
  type: http
  seq: 5

http:
  method: POST
  url: "{{checkin}}/api/v1/register"
  headers:
    - name: Accept-Charset
      value: application/json
    - name: Accept
      value: application/json
  body:
    type: json
    data: |
      {
          "firebase_token": "BYPASS_TOKEN",
          "contact_number": "+639123456789", 
          "password": "MySecretPassword123!",
          "password_confirmation": "MySecretPassword123!"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
