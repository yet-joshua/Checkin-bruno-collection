info:
  name: Reset Password
  type: http
  seq: 2

http:
  method: POST
  url: "{{checkin}}/api/v1/reset-password"
  headers:
    - name: Accept
      value: application/json
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |
      {
          "firebase_token": "BYPASS_TOKEN", //For Local test
          "contact_number": "+639123456789",
          "password": "NewSecretPassword123!",
          "password_confirmation": "NewSecretPassword123!"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
