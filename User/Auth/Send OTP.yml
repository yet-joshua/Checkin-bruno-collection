info:
  name: Send OTP
  type: http
  seq: 3

http:
  method: POST
  url: "{{checkin}}/api/v1/auth/send-otp"
  headers:
    - name: Accept
      value: application/json
  body:
    type: json
    data: |
      {
        "contact_number": "+639300196907",
        "recaptcha_token": "OPTIONAL_FOR_TEST_NUMBERS"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
