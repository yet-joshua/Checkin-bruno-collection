info:
  name: Register
  type: http
  seq: 3

http:
  method: POST
  url: "{{checkin}}/api/v1/auth/register"
  headers:
    - name: Accept
      value: application/json
  body:
    type: json
    data: |
      {
        "firebase_token": "eyJhbGciOiJSUzI1NiIs...", // The token returned by Firebase SDK after OTP verification
        "contact_number": "09123456789",
        "password": "Password123!",
        "password_confirmation": "Password123!"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
