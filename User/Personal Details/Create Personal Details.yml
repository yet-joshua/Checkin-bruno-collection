info:
  name: Create Personal Details
  type: http
  seq: 2

http:
  method: POST
  url: "{{baseUrl}}/user/personal-details"
  headers:
    - name: Accept
      value: application/json
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |
      {
        "name": "Sarah Connor",
        "birthdate": "2002-12-15",
        "email": "sarah.connor@example.com",
        "gender": "female",
        "address": "123 Main St, City",
        "interest_ids": [
          "9b1c2d3e-4f5g-6h7i-8j9k-0l1m2n3o4p5q"
        ]
      }
  auth:
    type: bearer
    token: "{{auth_token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
