info:
  name: Update Personal Details
  type: http
  seq: 3

http:
  method: PUT
  url: "{{baseUrl}}/user/personal-details"
  headers:
    - name: Accept
      value: application/json
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |
      {
        "name": "John Phillip",
        "birthdate": "1995-08-24",
        "gender": "female",
        "address": "123 Main St, City"
      }
  auth:
    type: bearer
    token: "{{auth_token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
