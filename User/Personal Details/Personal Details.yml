info:
  name: Personal Details
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/user/personal-details"
  headers:
    - name: Accept
      value: application/json
    - name: Content-Type
      value: application/json
  auth:
    type: bearer
    token: "{{auth_token}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("Mobile account request succeeds", function () {
          if (res.getStatus() !== 200) throw new Error("Unexpected response status");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
