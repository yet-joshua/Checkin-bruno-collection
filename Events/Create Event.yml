info:
  name: Create Event
  type: http
  seq: 1

http:
  method: POST
  url: "{{checkin}}/api/v1/events/"
  headers:
    - name: Content-Type
      value: application/json
    - name: Accept
      value: application/json
  body:
    type: json
    data: |
      {
        "title": "Grand Launch Party",
        "description": "Celebrating our new office opening.",
        "location_name": "Antigravity HQ, Level 42",
        "latitude": 14.5995,
        "longitude": 120.9842,
        "radius_meters": 50,
        "start_time": "2026-03-20 18:00:00",
        "end_time": "2026-03-20 23:00:00"
      }
  auth:
    type: bearer
    token: "{{auth_token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
