info:
  name: Update Event
  type: http
  seq: 6

http:
  method: PUT
  url: "{{checkin}}/api/v1/events/{event_id}"
  headers:
    - name: Content-Type
      value: application/json
    - name: Accept
      value: application/json
  body:
    type: json
    data: |
      {
        "title": "Summer Festival 2024",
        "location_name": "Central Park",
        "polygon_coordinates": [
            {"lat": 14.5, "lng": 121.0},
            {"lat": 14.6, "lng": 121.1}
        ]
      }
  auth:
    type: bearer
    token: "{{auth_token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
