info:
  name: Join Event
  type: http
  seq: 5

http:
  method: POST
  url: "{{baseUrl}}/events/{event_id}/join"
  headers:
    - name: Accept
      value: application/json
    - name: Content-Type
      value: application/json
  auth:
    type: bearer
    token: "{{auth_token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
