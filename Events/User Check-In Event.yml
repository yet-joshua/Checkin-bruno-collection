info:
  name: User Check-In Event
  type: http
  seq: 4

http:
  method: GET
  url: "{{checkin}}/api/v1/events/{event_id}/checkins"
  headers:
    - name: Content-Type
      value: application/json
    - name: Accept
      value: application/json
  auth:
    type: bearer
    token: "{{auth_token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
