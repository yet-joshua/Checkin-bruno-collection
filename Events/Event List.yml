info:
  name: Event List
  type: http
  seq: 1

http:
  method: GET
  url: "{{checkin}}/api/v1/events"
  headers:
    - name: Content-Type
      value: application/json
    - name: Accept
      value: application/json
  body:
    type: json
    data: ""
  auth:
    type: bearer
    token: "{{auth_token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
