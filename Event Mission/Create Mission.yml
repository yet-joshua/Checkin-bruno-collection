info:
  name: Create Mission
  type: http
  seq: 4

http:
  method: POST
  url: "{{checkin}}/api/v1/events/{event_id}/missions"
  headers:
    - name: Content-Type
      value: application/json
    - name: Accept
      value: application/json
  body:
    type: json
    data: |
      {
        "title": "Find the Hidden VIP Lounge",     
        "description": "Navigate to the top floor and find the red door." // Optional
      }
  auth:
    type: bearer
    token: "{{auth_token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
