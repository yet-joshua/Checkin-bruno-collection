info:
  name: Mission QR Scan
  type: http
  seq: 5

http:
  method: POST
  url: "{{checkin}}/api/v1/events/{event_id}/missions"
  headers:
    - name: Content-Type
      value: application/json
    - name: Accept
      value: application/json
  body:
    type: json
    data: |
      {
        "event_id": "9a1b2c3d-4e5f...",            // Required (Must be a valid UUID)
        "qr_trigger_token": "a1b2c3d4e5f6g7h8..."  // Required
      }
  auth:
    type: bearer
    token: "{{auth_token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
