info:
  name: Create Event Winner
  type: http
  seq: 2

http:
  method: POST
  url: "{{baseUrl}}/admin/events/{{event_id}}/winners"
  headers:
    - name: Accept
      value: application/json
    - name: Content-Type
      value: application/json
  body:
    mode: json
    json:
      user_id: "{{user_id_1}}"
      prize_name: "Sample non-raffle award"
      status: pending
      is_anonymous: false
  auth:
    type: bearer
    token: "{{admin_token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  Raffle awards must use the raffle declaration workflow. Generic creation and deletion return 422 for raffles.
  Existing raffle winner status/anonymity can be updated; prize_name and awarded_at are prohibited.
  Nested event and winner IDs must match. Non-raffle awards retain their existing behavior.
