info:
  name: Create Event Winner
  type: http
  seq: 2

http:
  method: POST
  url: "{{baseUrl}}/admin/events/{event_id}/winners"
  headers:
    - name: Accept
      value: application/json
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |
      {
        "user_id": "9a1b2c3d-...",
        "prize_name": "iPhone 17 Pro",
        "status": "pending",
        "is_anonymous": false,
        "awarded_at": "2024-03-30 14:00"
      }
  auth:
    type: bearer
    token: "{{admin_token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
