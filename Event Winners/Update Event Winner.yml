info:
  name: Update Event Winner
  type: http
  seq: 3

http:
  method: PUT
  url: "{{baseUrl}}/admin/events/{event_id}/winners/{winner_id}"
  headers:
    - name: Accept
      value: application/json
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |
      {
        "status": "claimed",
        "prize_name": "iPhone 17 Pro Max"
      }
  auth:
    type: bearer
    token: "{{admin_token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
