info:
  name: Accepted Profile
  type: http
  seq: 13

http:
  method: GET
  url: "{{baseUrl}}/admin/me"
  headers:
    - name: Accept
      value: application/json
    - name: Origin
      value: "{{frontendOrigin}}"
    - name: Cookie
      value: "{{onboarding_cookie}}"
    - name: X-XSRF-TOKEN
      value: "{{onboarding_xsrf}}"
  auth: null

runtime:
  scripts:
    - type: after-response
      code: |-
        const raw = res.getHeader("set-cookie") || [];
        const jar = JSON.parse(bru.getEnvVar("onboarding_cookies") || "{}");
        for (const line of (Array.isArray(raw) ? raw : [raw])) {
          const pair = line.split(";")[0]; const i = pair.indexOf("=");
          jar[pair.slice(0, i)] = pair.slice(i + 1);
        }
        bru.setEnvVar("onboarding_cookies", JSON.stringify(jar));
        bru.setEnvVar("onboarding_cookie", Object.entries(jar).map(([k, v]) => k + "=" + v).join("; "));
        if (jar["XSRF-TOKEN"]) bru.setEnvVar("onboarding_xsrf", decodeURIComponent(jar["XSRF-TOKEN"]));
    - type: tests
      code: |-
        test("Invitation lifecycle status", function () { expect(res.getStatus()).to.equal(200); });
        test("Onboarding is complete", function () { expect(res.getBody().data.invitation_pending).to.equal(false); });

settings:
  encodeUrl: true
  timeout: 10000
  followRedirects: true
  maxRedirects: 5
