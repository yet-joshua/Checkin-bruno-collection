info:
  name: Pending Token
  type: http
  seq: 2

http:
  method: GET
  url: "{{baseUrl}}/admin/me"
  headers:
    - name: Accept
      value: application/json
  auth:
    type: bearer
    token: "{{invitation_pending_token}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("Invitation lifecycle status", function () { expect(res.getStatus()).to.equal(403); });

settings:
  encodeUrl: true
  timeout: 10000
  followRedirects: true
  maxRedirects: 5
