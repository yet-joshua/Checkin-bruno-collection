info:
  name: Replaced Invitation
  type: http
  seq: 5

http:
  method: POST
  url: "{{baseUrl}}/admin/invitations/accept"
  headers:
    - name: Accept
      value: application/json
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "token": "{{old_invitation_token}}",
        "password": "{{invitation_password}}",
        "password_confirmation": "{{invitation_password}}"
      }
  auth: null

runtime:
  scripts:
    - type: tests
      code: |-
        test("Invitation lifecycle status", function () { expect(res.getStatus()).to.equal(410); });

settings:
  encodeUrl: true
  timeout: 10000
  followRedirects: true
  maxRedirects: 5
