info:
  name: Host Login
  type: http
  seq: 2

http:
  method: POST
  url: "{{checkin}}/api/v1/admin/login"
  body:
    type: json
    data: |-
      {
        "email": "host@checkin.app",
        "password" : "password"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
