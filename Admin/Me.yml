info:
  name: Me
  type: http
  seq: 4

http:
  method: GET
  url: "{{baseUrl}}/admin/me"
  headers:
    - name: Accept
      value: application/json
    - name: Content-Type
      value: application/json
  auth:
    type: bearer
    token: "{{admin_token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
