info:
  name: Admin Login
  type: http
  seq: 1

http:
  method: POST
  url: "{{checkin}}/api/v1/admin/login"
  body:
    type: json
    data: |-
      {
        "email": "admin@checkin.app",
        "password" : "password"
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        const response = res.getBody();
        bru.setEnvVar("admin_token", response.data.token);

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
