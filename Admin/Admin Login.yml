info:
  name: Admin Login
  type: http
  seq: 1

http:
  method: POST
  url: "{{baseUrl}}/admin/login"
  headers:
    - name: Accept
      value: application/json
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "email": "admin@checkin.app",
        "password": "password"
      }
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("Login returns a bearer token", function () {
          expect(res.getStatus()).to.equal(200);
          expect(res.getBody().data.token).to.be.a("string");
          expect(Date.parse(res.getBody().data.token_expires_at)).to.be.above(Date.now());
        });
    - type: after-response
      code: |-
        const response = res.getBody();
        if (res.getStatus() === 200 && response.status === "success") {
            bru.setEnvVar("admin_token", response.data.token);
        } else {
            console.error("Login failed. Server said:", response);
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
