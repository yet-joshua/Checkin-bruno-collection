info:
  name: Create Account
  type: http
  seq: 2

http:
  method: POST
  url: "{{baseUrl}}/admin/accounts"
  headers:
    - name: Accept
      value: application/json
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |
      {
        "email": "new.host@checkin.app",
        "password": "password",
        "password_confirmation": "password",
        "name": "New Host",
        "role": "host"
      }
  auth:
    type: bearer
    token: "{{admin_token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
