info:
  name: Get Account
  type: http
  seq: 6

http:
  method: GET
  url: "{{baseUrl}}/admin/accounts/{admin_id}"
  headers:
    - name: Accept
      value: application/json
    - name: Content-Type
      value: application/json
  auth:
    type: bearer
    token: "{{admin_token}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("Admin account detail returns scoped account data", function () {
          if (res.getStatus() !== 200) throw new Error("Expected HTTP 200");
          const body = res.getBody();
          if (body.status !== "success" || !body.data?.id) {
            throw new Error("Expected account detail payload");
          }
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

