info:
  name: Update Account Status
  type: http
  seq: 4

http:
  method: PATCH
  url: "{{baseUrl}}/admin/accounts/{admin_id}/status"
  headers:
    - name: Accept
      value: application/json
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |
      {
        "is_active": false
      }
  auth:
    type: bearer
    token: "{{admin_token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5