info:
  name: Update Account
  type: http
  seq: 3

http:
  method: PATCH
  url: "{{baseUrl}}/admin/accounts/{admin_id}"
  headers:
    - name: Accept
      value: application/json
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |
      {
        "name": "Updated Host Name",
        "email": "host@example.com",
        "role": "host"
      }
  auth:
    type: bearer
    token: "{{admin_token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5