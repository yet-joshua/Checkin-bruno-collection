info:
  name: Update Event
  type: http
  seq: 4

http:
  method: PUT
  url: "{{baseUrl}}/admin/events/{{event_id}}"
  headers:
    - name: Accept
      value: application/json
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |
      {
        "title": "Sample Event",
        "start_time": "2026-10-23T15:00:00+08:00",
        "end_time": "2026-10-23T17:00:00+08:00",
        "location_name": "Central Park",
        "polygon_coordinates": [
          {"lat": 14.5, "lng": 121.0},
          {"lat": 14.6, "lng": 121.0},
          {"lat": 14.6, "lng": 121.1},
          {"lat": 14.5, "lng": 121.1}
        ]
      }
  auth:
    type: bearer
    token: "{{admin_token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  Event start_time/end_time represent instants. Use ISO 8601 with Z or an explicit offset; the backend normalizes accepted timestamps to UTC before storage. Raffle draw_time is configured when creating the raffle.
