info:
  name: Promotion Event
  type: http
  seq: 2

http:
  method: POST
  url: "{{checkin}}/api/v1/events/"
  headers:
    - name: Content-Type
      value: application/json
    - name: Accept
      value: application/json
  body:
    type: json
    data: |
      {
        "title": "Brand New App Launch",
        "description": "Discover our new app and get exclusive launch perks.",
        "location_name": "City Square",
        "start_time": "2026-07-10 12:00:00",
        "end_time": "2026-07-15 20:00:00",
        "event_type": "promotion",
        "status": "published",
        "banner_url": "https://example.com/launch-banner.jpg",
        "external_link": "https://example.com/download-app",
        "polygon_coordinates": [
          {"lat": 14.5985, "lng": 120.9832},
          {"lat": 14.5985, "lng": 120.9852},
          {"lat": 14.6005, "lng": 120.9852},
          {"lat": 14.6005, "lng": 120.9832}
        ]
      }
  auth:
    type: bearer
    token: "{{auth_token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
