info:
  name: Raffle Draw Status
  type: http
  seq: 30

http:
  method: GET
  url: "{{baseUrl}}/admin/events/{{event_id}}/raffle/draw"
  headers:
    - name: Accept
      value: application/json
  auth:
    type: bearer
    token: "{{admin_token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
