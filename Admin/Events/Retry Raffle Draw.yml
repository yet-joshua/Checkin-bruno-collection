info:
  name: Retry Raffle Draw
  type: http
  seq: 31

http:
  method: POST
  url: "{{baseUrl}}/admin/events/{{event_id}}/raffle/draw/retry"
  headers:
    - name: Accept
      value: application/json
  auth:
    type: bearer
    token: "{{admin_token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
