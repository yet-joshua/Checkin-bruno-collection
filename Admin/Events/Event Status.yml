info:
  name: Event Status
  type: http
  seq: 6

http:
  method: PUT
  url: "{{baseUrl}}/events/{event_id}/status"
  headers:
    - name: Accept
      value: application/json
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "status": "published"
      }
  auth:
    type: bearer
    token: "{{admin_token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
