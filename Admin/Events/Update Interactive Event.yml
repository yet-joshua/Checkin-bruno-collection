info:
  name: Update Interactive Event
  type: http
  seq: 5

http:
  method: PUT
  url: "{{baseUrl}}/admin/events/{{event_id}}"
  headers:
    - name: Accept
      value: application/json
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |
      {
        "title": "Lucky Spin Wheel Extravaganza - Updated",
        "description": "Updated spin wheel description with more prizes!",
        "game_type": "spin_wheel",
        "interactive_settings": {
          "require_geofence": true,
          "require_checkin": true,
          "max_spins_per_user": 5,
          "spin_cost_points": 25,
          "allow_free_daily_spin": true
        },
        "game_prizes": [
          {
            "slice_index": 0,
            "label": "250 Bonus Points",
            "prize_type": "points",
            "points_reward": 250,
            "weight": 25,
            "quantity": -1,
            "color": "#FF5722"
          },
          {
            "slice_index": 1,
            "label": "VIP Discount Voucher",
            "prize_type": "voucher",
            "voucher_code_prefix": "VIPDISC",
            "weight": 15,
            "quantity": 30,
            "color": "#9C27B0"
          },
          {
            "slice_index": 2,
            "label": "Exclusive T-Shirt",
            "prize_type": "physical",
            "weight": 10,
            "quantity": 15,
            "color": "#2196F3"
          },
          {
            "slice_index": 3,
            "label": "Better Luck Next Time",
            "prize_type": "no_prize",
            "weight": 50,
            "quantity": -1,
            "color": "#9E9E9E"
          }
        ]
      }
  auth:
    type: bearer
    token: "{{admin_token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
