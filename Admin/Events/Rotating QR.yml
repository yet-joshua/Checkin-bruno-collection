info:
  name: Rotating QR
  type: http
  seq: 20

http:
  method: GET
  url: "{{baseUrl}}/admin/events/{{rotating_event_id}}/rotating-qr"
  headers:
    - name: Accept
      value: application/json
  auth:
    type: bearer
    token: "{{admin_token}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("Rotating QR payload and expiry", function () {
          expect(res.getStatus()).to.equal(200);
          const body = res.getBody();
          expect(body.is_rotating_qr).to.equal(true);
          expect(body.qr_data).to.equal(body.event_id + ":" + body.qr_code_token);
          expect(body.interval).to.be.at.least(60);
          expect(body.expires_in).to.be.greaterThan(0);
          expect(body.expires_in).to.be.at.most(body.interval);
        });

settings:
  encodeUrl: true
  timeout: 10000
  followRedirects: true
  maxRedirects: 5

docs: |-
  Set rotating_event_id to an event with rotating QR enabled, owned by the authenticated test admin. Render qr_data (event ID plus token); the response has no token field. Replace the QR payload and expiry together on each successful refresh. Refresh automatically after expires_in seconds; do not renew the countdown before a successful response. Generate the QR locally rather than sending the check-in payload to a third-party image service.
