info:
  name: Declare Raffle Winners
  type: http
  seq: 9

http:
  method: POST
  url: "{{baseUrl}}/admin/events/{{event_id}}/raffle/declare-winners"
  headers:
    - name: Accept
      value: application/json
    - name: Content-Type
      value: application/json
  auth:
    type: bearer
    token: "{{admin_token}}"
  body:
    mode: json
    json:
      winners:
        - user_id: "{{user_id_1}}"
          prize_id: "{{prize_id_1}}"
        - user_id: "{{user_id_2}}"
          prize_id: "{{prize_id_2}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  Only the event host or a super-admin can declare a published physical/hybrid raffle.
  Every selected user must be checked in, active, not blacklisted, and satisfy configured consent/age rules.
  Duplicate users, insufficient inventory, another event's prizes, completed draws, and automatic mode return 422.
  Success remains 201 with message and winners_count. Inbox/broadcast/push delivery is asynchronous.
