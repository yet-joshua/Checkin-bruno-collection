info:
  name: Reset Password
  type: http
  seq: 3

http:
  method: POST
  url: "{{baseUrl}}/admin/reset-password"
  headers:
    - name: Accept
      value: application/json
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |
      {
        "email": "admin@checkin.app",
        "token": "reset_token_here",
        "password": "NewSecret123!",
        "password_confirmation": "NewSecret123!"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
