info:
  name: Reset Password
  type: http
  seq: 4

http:
  method: POST
  url: "{{checkin}}/api/v1/admin/reset-password"
  body:
    type: json
    data: |
      {
          "email": "admin@checkin.app",
          "token": "reset_token_here",
          "password": "new_password",
          "password_confirmation": "new_password"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
