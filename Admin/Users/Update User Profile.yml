info:
  name: Update User Profile
  type: http
  seq: 3

http:
  method: PATCH
  url: "{{baseUrl}}/admin/users/{user_id}"
  headers:
    - name: Accept
      value: application/json
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |
      {
        "name": "Jane User",
        "contact_number": "+639171234567",
        "email": "janeuser@example.com",
        "gender": "female",
        "birthdate": "1998-08-20",
        "address": "456 User Ave, Manila",
        "bio": "App user bio text"
      }
  auth:
    type: bearer
    token: "{{admin_token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
