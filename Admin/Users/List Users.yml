info:
  name: List Users
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/admin/users"
  headers:
    - name: Accept
      value: application/json
  params:
    - name: page
      value: "1"
      enabled: false
    - name: per_page
      value: "20"
      enabled: false
    - name: search
      value: "917"
      enabled: false
    - name: status
      value: "verified"
      enabled: false
  auth:
    type: bearer
    token: "{{admin_token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
