info:
  name: Update Profile
  type: http
  seq: 3

http:
  method: PUT
  url: "{{baseUrl}}/admin/profile/{admin_id}"
  headers:
    - name: Accept
      value: application/json
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "name": "Host Organization",
        "bio": "Organizer description and about info",
        "address": "123 Event Street, City"
      }
  auth:
    type: bearer
    token: "{{admin_token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
