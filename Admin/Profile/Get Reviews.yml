info:
  name: Get Reviews
  type: http
  seq: 4

http:
  method: GET
  url: "{{baseUrl}}/admin/profile/{admin_id}/reviews"
  headers:
    - name: Accept
      value: application/json
  auth:
    type: bearer
    token: "{{admin_token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
