info:
  name: Upload Photo
  type: http
  seq: 1

http:
  method: POST
  url: "{{baseUrl}}/admin/profile/{admin_id}/photo"
  headers:
    - name: Accept
      value: application/json
  body:
    type: multipart-form
    data:
      - name: photo
        type: file
        value:
          - /path/to/photo.png
  auth:
    type: bearer
    token: "{{admin_token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
