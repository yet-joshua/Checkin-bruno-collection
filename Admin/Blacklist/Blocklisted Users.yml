info:
  name: Blocklisted Users
  type: http
  seq: 2

http:
  method: GET
  url: "{{baseUrl}}/events/{event_id}/blacklists"
  headers:
    - name: Accept
      value: application/json
    - name: Content-Type
      value: application/json
  auth:
    type: bearer
    token: "{{admin_token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
