info:
  name: Blocklist User
  type: http
  seq: 1

http:
  method: POST
  url: "{{baseUrl}}/events/{event_id}/blacklists"
  headers:
    - name: Accept
      value: application/json
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |
      {
        "user_id": "uuid-of-the-user",
        "reason": "Optional reason text"
      }
  auth:
    type: bearer
    token: "{{admin_token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
