info:
  name: Blocklist User
  type: http
  seq: 2

http:
  method: POST
  url: "{{checkin}}/api/v1/events/{events}/blacklists"
  headers:
    - name: Content-Type
      value: application/json
    - name: Accept
      value: application/json
  body:
    type: json
    data: |
      {
        "user_id": "uuid-of-the-user",   // required, must exist in users table
        "reason": "Optional reason text"  // nullable, max 500 chars
      }
  auth:
    type: bearer
    token: "{{admin_token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
