info:
  name: Forgot Password
  type: http
  seq: 2

http:
  method: POST
  url: "{{baseUrl}}/admin/forgot-password"
  headers:
    - name: Accept
      value: application/json
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "email": "admin@checkin.app"
      }
  auth: null

runtime:
  scripts:
    - type: tests
      code: |-
        test("Recovery response is generic", function () {
          expect(res.getStatus()).to.equal(200);
          expect(res.getBody().message).to.contain("If an account exists");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
