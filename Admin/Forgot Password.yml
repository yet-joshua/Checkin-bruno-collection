info:
  name: Forgot Password
  type: http
  seq: 3

http:
  method: POST
  url: "{{checkin}}/api/v1/admin/forgot-password"
  body:
    type: json
    data: |-
      {
        "email": "host@checkin.app"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
