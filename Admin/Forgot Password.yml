info:
  name: Forgot Password
  type: http
  seq: 2

http:
  method: POST
  url: "{{baseUrl}}/admin/forgot-password"
  headers:
    - name: Accept
      value: application/json
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "email": "admin@checkin.app"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
