info:
  name: Admin Token After Reset
  type: http
  seq: 7

http:
  method: GET
  url: "{{baseUrl}}/admin/me"
  headers:
    - name: Accept
      value: application/json
  auth:
    type: bearer
    token: "{{admin_token}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("Token lifecycle status", function () {
          expect(res.getStatus()).to.equal(401);
        });

settings:
  encodeUrl: true
  timeout: 10000
  followRedirects: true
  maxRedirects: 5
