info:
  name: Change Password
  type: http
  seq: 3

http:
  method: POST
  url: "{{baseUrl}}/auth/change-password"
  headers:
    - name: Accept
      value: application/json
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "current_password": "password",
        "password": "NewSecretPassword123!",
        "password_confirmation": "NewSecretPassword123!"
      }
  auth:
    type: bearer
    token: "{{auth_token}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("Token lifecycle status", function () {
          expect(res.getStatus()).to.equal(200);
        });

settings:
  encodeUrl: true
  timeout: 10000
  followRedirects: true
  maxRedirects: 5
