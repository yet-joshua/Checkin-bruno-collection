info:
  name: Expired Mobile Token
  type: http
  seq: 7

http:
  method: GET
  url: "{{baseUrl}}/user"
  headers:
    - name: Accept
      value: application/json
  auth:
    type: bearer
    token: "{{expired_token}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("Account access is enforced", function () {
          expect(res.getStatus()).to.equal(401);
        });

settings:
  encodeUrl: true
  timeout: 10000
  followRedirects: true
  maxRedirects: 5
