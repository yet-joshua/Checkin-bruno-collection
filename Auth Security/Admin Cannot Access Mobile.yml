info:
  name: Admin Cannot Access Mobile
  type: http
  seq: 2

http:
  method: GET
  url: "{{baseUrl}}/user"
  headers:
    - name: Accept
      value: application/json
  auth:
    type: bearer
    token: "{{admin_token}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("Account access is enforced", function () {
          expect(res.getStatus()).to.equal(403);
        });

settings:
  encodeUrl: true
  timeout: 10000
  followRedirects: true
  maxRedirects: 5
