info:
  name: Mobile Cannot Access Admin
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/admin/me"
  headers:
    - name: Accept
      value: application/json
  auth:
    type: bearer
    token: "{{auth_token}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("Account access is enforced", function () {
          expect(res.getStatus()).to.equal(403);
        });

settings:
  encodeUrl: true
  timeout: 10000
  followRedirects: true
  maxRedirects: 5
