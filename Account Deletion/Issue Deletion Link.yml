info:
  name: Issue Deletion Link
  type: http
  seq: 2

http:
  method: POST
  url: "{{baseUrl}}/auth/deletion-link"
  headers:
    - name: Accept
      value: application/json
  auth:
    type: bearer
    token: "{{deletion_token}}"

runtime:
  scripts:
    - type: after-response
      code: |-
        if (res.getStatus() === 201) bru.setEnvVar("deletion_link", res.getBody().data.url.split("#link=")[1]);
    - type: tests
      code: |-
        test("Expected authentication status", function () {
          expect(res.getStatus()).to.equal(201);
        });

settings:
  encodeUrl: true
  timeout: 10000
  followRedirects: true
  maxRedirects: 5
