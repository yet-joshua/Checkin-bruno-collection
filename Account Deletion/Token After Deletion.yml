info:
  name: Token After Deletion
  type: http
  seq: 13

http:
  method: GET
  url: "{{baseUrl}}/user"
  headers:
    - name: Accept
      value: application/json
  auth:
    type: bearer
    token: "{{deletion_token}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("Expected authentication status", function () {
          expect(res.getStatus()).to.equal(401);
        });

settings:
  encodeUrl: true
  timeout: 10000
  followRedirects: true
  maxRedirects: 5
