info:
  name: Host List
  type: http
  seq: 7

http:
  method: GET
  url: "{{baseUrl}}/hosts"
  headers:
    - name: Accept
      value: application/json
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("Host list supports anonymous, mobile and admin callers", function () {
          if (res.getStatus() !== 200) throw new Error("Expected HTTP 200");
          const hosts = res.getBody();
          if (!Array.isArray(hosts)) throw new Error("Expected host array");
          for (const host of hosts) {
            if (typeof host.is_followed !== "boolean") throw new Error("Expected boolean follow status");
          }
        });

settings:
  encodeUrl: true
  timeout: 10000
  followRedirects: true
  maxRedirects: 5
